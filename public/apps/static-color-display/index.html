<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Static Color Display — Jayce Renner</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Color" />
    <meta name="description" content="One color, the whole screen, and nothing else. Pick it in the overlay and it stays. Opens on pure red." />
    <meta name="theme-color" content="#ff0000" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jayce Renner — Creative Coding" />
    <meta property="og:title" content="Static Color Display" />
    <meta property="og:description" content="One color, the whole screen, and nothing else. Pick it in the overlay and it stays. Opens on pure red." />
    <meta property="og:url" content="%SITE_URL%/apps/static-color-display/" />
    <meta property="og:image" content="%SITE_URL%/og/static-color-display.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Static Color Display" />
    <meta name="twitter:description" content="One color, the whole screen, and nothing else. Pick it in the overlay and it stays. Opens on pure red." />
    <meta name="twitter:image" content="%SITE_URL%/og/static-color-display.jpg" />
    <style>
      * { box-sizing: border-box; }
      /* The page itself is the color. Set here as well as on the field so there
         is no dark flash before the script runs, and so an overscroll on a phone
         shows the color rather than a strip of black underneath it. */
      html, body { margin: 0; height: 100%; overflow: hidden; background: #ff0000; }
      #field {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: #ff0000;
      }

      .bar {
        position: fixed;
        top: 0; left: 0; right: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 12px 18px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        color: #fff;
        /* The one thing in here that has to work over ANY color the picker can
           reach. A scrim rather than a color chosen to contrast: white on a dark
           fade is legible over a pure yellow and over a pure black alike, and
           does not have to be recalculated every time the field changes. */
        background: linear-gradient(180deg, rgba(0,0,0,0.5), rgba(0,0,0,0));
        pointer-events: none;
      }
      .bar h1 { margin: 0; font-size: 1rem; font-weight: 600; letter-spacing: -0.01em; }
      .bar .back {
        pointer-events: auto;
        color: #fff;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
        padding: 6px 12px;
        border: 1px solid rgba(255,255,255,0.35);
        border-radius: 999px;
        white-space: nowrap;
        transition: background 0.15s ease;
      }
      .bar .back:hover { background: rgba(255,255,255,0.15); }
      .bar .menu {
        pointer-events: auto;
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        background: none;
        height: 30px;
        padding: 0 13px;
        border: 1px solid rgba(255,255,255,0.35);
        border-radius: 999px;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      .bar .menu:hover { background: rgba(255,255,255,0.15); }

      @media (max-width: 700px) {
        .back-label { display: none; }
        .bar { gap: 9px; padding: 12px 14px; }
        .bar h1 { display: none; }
      }
      body.idle.menu-open .bar { opacity: 1; pointer-events: auto; }

      .scrim {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
        /* Undimmed, because the color behind the panel is the entire piece and
           the whole point of having the picker open is to watch it change. */
        background: transparent;
        animation: scrim-in 0.18s ease;
      }
      .scrim[hidden] { display: none; }

      .sheet {
        position: relative;
        opacity: 0.92;
        width: 100%;
        max-width: 320px;
        max-height: 100%;
        overflow-y: auto;
        padding: 18px 20px 20px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        color: #fff;
        background: rgba(0,0,0,0.72);
        border: 1px solid rgba(255,255,255,0.35);
        border-radius: 16px;
        animation: sheet-in 0.22s cubic-bezier(0.2, 0.9, 0.3, 1.15);
      }
      .sheet-head {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 0 0 6px;
      }
      .sheet h2 { margin: 0 auto 0 0; font-size: 1.05rem; font-weight: 650; letter-spacing: -0.01em; }
      .sheet .intro {
        margin: 0 0 16px;
        font-size: 0.82rem;
        line-height: 1.45;
        opacity: 0.72;
      }
      .sheet .close {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 26px; height: 26px;
        font-size: 0.85rem;
        color: #fff;
        background: none;
        border: 1px solid rgba(255,255,255,0.3);
        border-radius: 999px;
        cursor: pointer;
        opacity: 0.75;
        transition: background 0.15s ease, opacity 0.15s ease;
      }
      .sheet .close:hover { background: rgba(255,255,255,0.14); opacity: 1; }
      .sheet .close:focus-visible { border-color: rgba(255,255,255,0.55); opacity: 1; }

      .sheet .pick-label {
        margin: 0 0 6px;
        font-size: 0.9rem;
        font-weight: 500;
      }
      .sheet .picker {
        display: flex;
        align-items: stretch;
        gap: 8px;
      }
      /* The native swatch, with the browser's own chrome taken off it: every
         engine draws this control differently, and a bordered box inside a
         bordered box is what you get if you leave it alone. */
      .sheet input[type="color"] {
        appearance: none;
        -webkit-appearance: none;
        flex: none;
        width: 64px;
        height: 40px;
        padding: 0;
        background: none;
        border: 1px solid rgba(255,255,255,0.35);
        border-radius: 10px;
        cursor: pointer;
      }
      .sheet input[type="color"]::-webkit-color-swatch-wrapper { padding: 3px; }
      .sheet input[type="color"]::-webkit-color-swatch { border: none; border-radius: 7px; }
      .sheet input[type="color"]::-moz-color-swatch { border: none; border-radius: 7px; }
      .sheet input[type="color"]:focus-visible { border-color: rgba(255,255,255,0.7); }
      .sheet input[type="text"] {
        flex: 1;
        min-width: 0;
        padding: 0 12px;
        font: inherit;
        font-size: 0.95rem;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #fff;
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.28);
        border-radius: 10px;
      }
      .sheet input[type="text"]:focus-visible { outline: none; border-color: rgba(255,255,255,0.7); }
      /* Typed halfway, a hex is not a color yet. Said plainly rather than by
         refusing the keystroke, which is how a field that will not let you
         delete the last character gets written. */
      .sheet input[type="text"][aria-invalid="true"] { border-color: #ffb4a8; }

      .sheet .desc {
        margin: 10px 0 0;
        font-size: 0.76rem;
        line-height: 1.4;
        opacity: 0.62;
      }
      .sheet .action {
        display: block;
        width: 100%;
        margin-top: 18px;
        padding: 12px 0;
        font: inherit;
        font-size: 0.95rem;
        font-weight: 600;
        color: #10231d;
        background: #7fe8c0;
        border: 1px solid transparent;
        border-radius: 999px;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      .sheet .action:hover { background: #fff; }

      @keyframes scrim-in { from { opacity: 0; } }
      @keyframes sheet-in { from { opacity: 0; transform: translateY(8px) scale(0.97); } }
      @media (prefers-reduced-motion: reduce) {
        .scrim, .sheet { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="field"></div>

    <header class="bar">
      <a class="back" href="../../">← <span class="back-label">Gallery</span></a>
      <h1>Static Color Display</h1>
      <button class="menu" id="menu-btn" type="button" aria-label="Settings" aria-haspopup="dialog" aria-expanded="false"></button>
    </header>

    <div class="scrim" id="scrim" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <div class="sheet-head">
          <h2 id="sheet-title">Static Color Display</h2>
          <button class="close" id="close-btn" type="button" aria-label="Close settings">✕</button>
        </div>

        <p class="intro">One color, the whole screen. Nothing moves, nothing arrives, and nothing is coming next.</p>

        <div class="pick-label" id="color-label">Color</div>
        <div class="picker">
          <input type="color" id="color" value="#ff0000" aria-labelledby="color-label" />
          <input type="text" id="hex" value="#FF0000" spellcheck="false" autocomplete="off"
                 autocapitalize="off" maxlength="7" aria-label="The color as a hex value" />
        </div>
        <p class="desc">Pick it, or type it. It opens on pure red and comes back on whatever you left it.</p>

        <button class="action" id="done-btn" type="button">Look</button>
      </div>
    </div>

    <script src="../shared/autohide.js"></script>
    <script src="../shared/menu-icon.js"></script>
    <script src="./static-color-display.js"></script>
  </body>
</html>
