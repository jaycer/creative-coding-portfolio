<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 400" width="600" height="400">
  <!-- A real frame off the running piece (the Snake Columns preset), at the native
       256 by 224 and scaled up here the same way the app scales it: nearest
       neighbor, so the tile shows the actual pixel grid rather than a smoothed
       photograph of one. Stored as a 4-bit indexed PNG because the frame really
       is 16 colors - two indexed layers added - so that is simply what it is,
       and it costs a fifth of what the truecolor version did. -->
  <defs>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.72"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#12001c"/>
  <image x="0" y="-10" width="600" height="420" preserveAspectRatio="xMidYMid slice"
         image-rendering="pixelated" style="image-rendering:pixelated"
         xlink:href="data:image/png;base64,"/>
  <rect x="0" y="280" width="600" height="120" fill="url(#scrim)"/>
  <text x="40" y="360" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="32" font-weight="600" fill="#fff">Earthbound Layers</text>
</svg>
